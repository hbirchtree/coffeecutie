name: CMake Build
'on':
  push:
    branches:
    - master
    - testing
    - feature**
    tags: '*'
jobs:
  Release:
    name: "Create release"
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Printing some info
      run: echo "Received ref $GITHUB_REF"
    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      run: gh release create ${GITHUB_REF:10} -R ${{ github.repository }} -p -t "Automatic
        Release ${GITHUB_REF:10}" -n "Automatically generated by Actions" --target
        ${{ github.sha }}
  Linux_HostTools:
    runs-on: ubuntu-latest
    needs: Release
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    name: Linux host tools
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - name: Installing build-essential
      run: |
        sudo rm /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt install build-essential nasm autoconf automake autoconf-archive libtool
    - uses: ./source/.github/actions/build-host-tools
      with:
        cache_path: source/multi_build/host-x64-linux-native
  Linux:
    runs-on: ubuntu-latest
    needs: Linux_HostTools
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: android:arm-neon:19:rel
          artifact: android-arm-neon-19
        - variant: android:arm-neon:24:rel
          artifact: android-arm-neon-24
        - variant: android:arm64:30-gl:rel
          artifact: android-arm64-30-gl
        - variant: android:arm64:32:rel
          artifact: android-arm64-32
        - variant: beaglebone:arm-buildroot-linux-gnueabihf:ti-sgx:rel
          artifact: beaglebone-arm-buildroot-linux-gnueabihf-ti-sgx
        - variant: desktop:aarch64-buildroot-linux-gnu:multi:rel
          artifact: desktop-aarch64-buildroot-linux-gnu-multi
        - variant: desktop:arm-buildroot-linux-gnueabihf:sdl2:rel
          artifact: desktop-arm-buildroot-linux-gnueabihf-sdl2
        - variant: desktop:x86_64-buildroot-linux-gnu:multi:rel
          artifact: desktop-x86_64-buildroot-linux-gnu-multi
        - variant: desktop:x86_64-w64-mingw32:posix:rel
          artifact: desktop-x86_64-w64-mingw32-posix
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    name: ${{ matrix.variant }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - uses: actions/setup-java@v5
      if: startsWith(matrix.variant, 'android:')
      with:
        distribution: 'adopt'
        java-version: '17'
    - name: Installing build-essential
      run: |
        sudo rm /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt install build-essential inkscape flatpak nasm squashfs-tools autoconf automake autoconf-archive libtool
    - name: Host tools cache
      uses: actions/cache@v5
      with:
        path: source/multi_build/host-x64-linux-native
        key: host-tools-${{ runner.os }}-${{ hashFiles('source/tools','source/toolchain/building.py','source/vcpkg.json','source/vcpkg-configuration.json','source/.cmake/CMakePresets.linux.json','source/.cmake/CMakePresets.apple.json') }}
        fail-on-cache-miss: true
    - name: Space summary
      run: |
        echo "::info::Total disk usage"
        df -h
        echo "::info::Source dir space usage"
        df -h source/
        echo "::info::du in source/"
        du -hd2 source/
        echo "::info::du in ."
        du -hd2 .
    - uses: ./source/.github/actions/build-project
      with:
        variant: ${{ matrix.variant }}
        artifact: ${{ matrix.artifact }}
        embedded_report_url: "https://reports.speen.dev"
    - name: Summarize binary sizes
      run: du -h source/multi_build/${{matrix.artifact}}/bin/* source/multi_build/${{matrix.artifact}}/lib/*.so* source/multi_build/${{matrix.artifact}}/packaged/*/* || true
    - name: Uploading artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.artifact}}
        path: |
          source/multi_build/${{matrix.artifact}}/install/bin
          source/multi_build/${{matrix.artifact}}/install/lib
          !source/multi_build/${{matrix.artifact}}/install/lib/*.a
          source/multi_build/${{matrix.artifact}}/install/packaged
        if-no-files-found: error
  WebAssembly:
    runs-on: ubuntu-latest
    needs: Linux_HostTools
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: web:wasm32-emscripten:webgl2:rel
          build: web-wasm32-emscripten-webgl2
          args: ''
          artifact: web-wasm32-emscripten-webgl2
        - variant: web:wasm32-emscripten:webgl2:rel
          build: web-wasm32-emscripten-webgl2
          args: '-DBLAM_HALO_VERSION=custom_version_t'
          artifact: web-wasm32-emscripten-webgl2-custom
        - variant: web:wasm32-emscripten:webgl2:rel
          build: web-wasm32-emscripten-webgl2
          args: '-DBLAM_HALO_VERSION=xbox_version_t'
          artifact: web-wasm32-emscripten-webgl2-xbox
        - variant: web:wasm32-emscripten:webgl2:rel
          build: web-wasm32-emscripten-webgl2
          args: '-DBLAM_HALO_VERSION=mcc_version_t'
          artifact: web-wasm32-emscripten-webgl2-mcc
        - variant: web:wasm32-emscripten:webgl2:rel
          build: web-wasm32-emscripten-webgl2
          args: '-DBLAM_HALO_VERSION=trial_version_t'
          artifact: web-wasm32-emscripten-webgl2-trial
        - variant: web:wasm64-emscripten:webgl2:rel
          build: web-wasm64-emscripten-webgl2
          args: ''
          artifact: web-wasm64-emscripten-webgl2
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    name: ${{ matrix.artifact }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - name: Installing build-essential
      run: |
        sudo rm /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt install build-essential inkscape nasm autoconf automake autoconf-archive libtool
    - name: Host tools cache
      uses: actions/cache@v5
      with:
        path: source/multi_build/host-x64-linux-native
        key: host-tools-${{ runner.os }}-${{ hashFiles('source/tools','source/toolchain/building.py','source/vcpkg.json','source/vcpkg-configuration.json','source/.cmake/CMakePresets.linux.json','source/.cmake/CMakePresets.apple.json') }}
        fail-on-cache-miss: true
    - uses: ./source/.github/actions/build-project
      with:
        variant: ${{ matrix.variant }}
        artifact: ${{ matrix.artifact }}
        args: ${{ matrix.args }}
        embedded_report_url: "https://reports.speen.dev"
    - name: Uploading artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.artifact}}
        path: source/multi_build/${{matrix.build}}/install/bin
        if-no-files-found: error
  Gekko:
    runs-on: ubuntu-latest
    needs: Linux_HostTools
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: console:powerpc-eabi:cube:rel
          artifact: console-powerpc-eabi-cube
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    name: ${{ matrix.variant }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - name: Installing build-essential
      run: |
        sudo rm /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt install build-essential inkscape nasm libgl1-mesa-dev autoconf automake autoconf-archive libtool
    - name: Host tools cache
      uses: actions/cache@v5
      with:
        path: source/multi_build/host-x64-linux-native
        key: host-tools-${{ runner.os }}-${{ hashFiles('source/tools','source/toolchain/building.py','source/vcpkg.json','source/vcpkg-configuration.json','source/.cmake/CMakePresets.linux.json','source/.cmake/CMakePresets.apple.json') }}
        fail-on-cache-miss: true
    - uses: ./source/.github/actions/build-project
      with:
        variant: ${{ matrix.variant }}
        artifact: ${{ matrix.artifact }}
        target: BlamBSP_GX
    - name: Uploading artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.artifact}}
        path: source/multi_build/${{matrix.artifact}}/bin
        if-no-files-found: error
  WebRTCGateway:
    # Standalone Go build, independent of the cb/vcpkg toolchain entirely --
    # tools/webrtc-gateway (see examples/blam/cblam-testing/WEBRTC_TRANSPORT.md)
    # is a separate process, not linked into BlamGraphics. Built once here,
    # cached and uploaded as an artifact, so Test_webrtc_wasm_client doesn't
    # pay for a Go module download + compile on every run.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - goarch: amd64
          artifact: webrtc-gateway-linux-amd64
        - goarch: arm64
          artifact: webrtc-gateway-linux-arm64
    name: "webrtc-gateway (linux/${{ matrix.goarch }})"
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - uses: actions/setup-go@v7
      with:
        go-version-file: source/tools/webrtc-gateway/go.mod
        cache-dependency-path: source/tools/webrtc-gateway/go.sum
    - name: Build gateway
      working-directory: source/tools/webrtc-gateway
      env:
        CGO_ENABLED: '0'
        GOOS: linux
        GOARCH: ${{ matrix.goarch }}
      run: go build -o gateway .
    - name: Uploading artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: source/tools/webrtc-gateway/gateway
        if-no-files-found: error
  macOS_HostTools:
    runs-on: macos-latest
    needs: Release
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    name: macOS host tools
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - name: List sysctl
      run: sysctl -a
    - name: Installing Inkscape + other stuff
      run: |
        brew install --cask inkscape
        brew install automake libtool autoconf autoconf-archive
    - uses: ./source/.github/actions/build-host-tools
      with:
        cache_path: source/multi_build/host-arm64-osx
        build_args: dbg
    - name: List files
      run: |
        du -hd4 source/multi_build/host-arm64-osx/
        find source/multi_build/host-arm64-osx/vcpkg_installed/arm64-osx/tools -type f
  macOS:
    runs-on: macos-latest
    needs: macOS_HostTools
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: desktop:x86_64-darwin:macos:rel
          artifact: desktop-x86_64-darwin-macos
          mode: rel
        - variant: desktop:universal-darwin:macos:rel
          artifact: desktop-universal-darwin-macos
        - variant: ios:x86_64-darwin:simulator:dbg
          artifact: ios-x86_64-darwin-simulator
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    name: ${{ matrix.variant }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - name: Installing Inkscape + other stuff
      run: |
        brew install --cask inkscape
        brew install automake autoconf autoconf-archive libtool
        # git cmake ninja pkg-config wget
    - name: Host tools cache
      uses: actions/cache@v5
      with:
        path: source/multi_build/host-arm64-osx
        key: host-tools-${{ runner.os }}-${{ hashFiles('source/tools','source/toolchain/building.py','source/vcpkg.json','source/vcpkg-configuration.json','source/.cmake/CMakePresets.linux.json','source/.cmake/CMakePresets.apple.json') }}
        fail-on-cache-miss: true
    - uses: ./source/.github/actions/build-project
      with:
        variant: ${{ matrix.variant }}
        artifact: ${{ matrix.artifact }}
    - name: Creating archive of artifacts
      run: tar cvf apps.tar source/multi_build/${{matrix.artifact}}/install/bin
    - name: Uploading artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.artifact}}
        path: apps.tar
        if-no-files-found: error
  Test_x86_64_mesa:
    if: ${{ always() }}
    name: "Software render test (MESA, ${{ matrix.variant }})"
    needs: Linux
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: core_33
          dummy_plug: dummy_plug_core_33.json
        - variant: core_43
          dummy_plug: dummy_plug_core_43.json
        - variant: core_45
          dummy_plug: dummy_plug_core_45.json
        - variant: es_20
          dummy_plug: dummy_plug_es_20.json
        - variant: es_30
          dummy_plug: dummy_plug_es_30.json
        - variant: es_32
          dummy_plug: dummy_plug_es_32.json
        # Multiplayer: this one config makes the process a server
        # (net_listen) and fork+execs a client child seeded with the
        # client scenario config (dummy plug "spawn" support) — server and
        # client run in the same job, journals compared afterwards. Boots
        # bloodgulch, switches to beavercreek mid-session.
        - variant: net_multiplayer
          dummy_plug: net/dummy_plug_net_host_scenario.json
          boot_map: bloodgulch.map
          journal_check: 'true'
          skip_audio: 'true'
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - name: Installing AppImage/media dependencies
      run: |
        sudo apt update
        sudo apt install libfuse2 ffmpeg xvfb mesa-utils
    - name: Downloading desktop-x86_64-buildroot-linux-gnu-multi artifacts
      uses: actions/download-artifact@v8
      with:
        name: desktop-x86_64-buildroot-linux-gnu-multi
        path: artifacts/
    - name: Relocating artifacts
      run: |
        mkdir -p source/multi_build/desktop-x86_64-buildroot-linux-gnu-multi
        mv artifacts/* source/multi_build/desktop-x86_64-buildroot-linux-gnu-multi/
        chmod +x source/multi_build/desktop-x86_64-buildroot-linux-gnu-multi/packaged/*/*
    - name: Run dummy plug tests
      run: |
        DUMMY_PLUG=${{ matrix.dummy_plug }} BOOT_MAP=${{ matrix.boot_map }} xvfb-run --auto-servernum source/.github/tests/test_blam_graphics.sh
    - name: Verify multiplayer journals
      if: matrix.journal_check == 'true'
      run: |
        SERVER_JOURNAL="$BLAM_TEST_OUTPUT_DIR/journal.jsonl"
        CLIENT_JOURNAL="$BLAM_TEST_OUTPUT_DIR/client0/journal.jsonl"
        if python3 source/.github/tests/net/compare_journals.py "$SERVER_JOURNAL" "$CLIENT_JOURNAL"; then
          exit 0
        fi
        echo "::group::merged journal timeline"
        python3 source/.github/tests/net/compare_journals.py --timeline "$SERVER_JOURNAL" "$CLIENT_JOURNAL" || true
        echo "::endgroup::"
        exit 1
    - name: Convert audio samples to .wav
      if: ${{ always() && matrix.skip_audio != 'true' }}
      run: |
        if [ -f "$BLAM_TEST_OUTPUT_DIR/rendered_audio" ]; then
          ffmpeg -f f32le -ar 48k -ac 2 -i "$BLAM_TEST_OUTPUT_DIR/rendered_audio" -c:a copy "$BLAM_TEST_OUTPUT_DIR/rendered_audio.wav"
          rm "$BLAM_TEST_OUTPUT_DIR/rendered_audio"
        fi
    - name: Uploading test artifacts
      if: ${{ always() && matrix.skip_audio != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_test_${{ matrix.variant }}
        path: "${{ env.BLAM_TEST_OUTPUT_DIR }}"
        if-no-files-found: error
    - name: Uploading test artifacts (no audio)
      if: ${{ always() && matrix.skip_audio == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_test_${{ matrix.variant }}
        path: |
          ${{ env.BLAM_TEST_OUTPUT_DIR }}
          !${{ env.BLAM_TEST_OUTPUT_DIR }}/**/rendered_audio
          !${{ env.BLAM_TEST_OUTPUT_DIR }}/**/rendered_audio.wav
        if-no-files-found: error
  Test_wasm_swiftshader:
    if: ${{ always() }}
    name: "Software render test (SwiftShader, ${{ matrix.variant }}-emscripten, WebGL2)"
    needs: WebAssembly
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: wasm32
          - variant: wasm64
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Downloading web-${{ matrix.variant }}-emscripten-webgl2 artifacts
      uses: actions/download-artifact@v8
      with:
        name: web-${{ matrix.variant }}-emscripten-webgl2
        path: artifacts/
    - name: Locating WebGL bundle
      id: bundle
      run: |
        BUNDLE=$(find artifacts -type d -name BlamGraphics.bundle | head -n 1)
        echo "Found bundle: $BUNDLE"
        echo "dir=$BUNDLE" >> "$GITHUB_OUTPUT"
    - name: Run WebGL software-render smoke test
      env:
        CI: "true"
        RUN_SECONDS: "30"
        ARGS: "map=pc/beavercreek.map"
      run: |
        source/.github/tests/web/run_webgl_test.sh "${{ steps.bundle.outputs.dir }}" /tmp/blam_webgl
    - name: Uploading test artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_test_${{ matrix.variant }}_webgl2
        path: /tmp/blam_webgl
        if-no-files-found: error
  Test_webrtc_wasm_client:
    # Exercises the actual target scenario for the WebRTC DataChannel
    # transport (examples/blam/cblam-testing/WEBRTC_TRANSPORT.md): a wasm
    # BlamGraphics client, headless in Chromium, connecting through one
    # webrtc-gateway to a fleet-registered native BlamGraphics server
    # (the same single-gateway topology as production). Unlike
    # Test_wasm_swiftshader this isn't a rendering test -- it's a
    # network-handshake test, verified via console-log markers (join
    # confirmation + roster sync), since comp_app::dummy_plug/Journal
    # doesn't exist on the wasm side (see .github/tests/web/README.md).
    if: ${{ always() }}
    name: "WebRTC: Wasm <-> GW <-> x86_64"
    needs:
    - Linux
    - WebAssembly
    - WebRTCGateway
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Downloading desktop-x86_64-buildroot-linux-gnu-multi artifacts (server)
      uses: actions/download-artifact@v8
      with:
        name: desktop-x86_64-buildroot-linux-gnu-multi
        path: server_artifacts/
    - name: Downloading web-wasm32-emscripten-webgl2 artifacts (client)
      uses: actions/download-artifact@v8
      with:
        name: web-wasm32-emscripten-webgl2
        path: client_artifacts/
    - name: Downloading webrtc-gateway-linux-amd64 artifact
      uses: actions/download-artifact@v8
      with:
        name: webrtc-gateway-linux-amd64
        path: gateway_artifacts/
    - name: Installing Mesa/EGL dependencies
      run: |
        sudo apt update
        sudo apt install mesa-utils
    - name: Acquire the sysroot for the desktop x86_64 platform
      run: |
        # Same sysroot tarball .github/tests/test_blam_graphics.sh uses --
        mkdir -p sysroot/lib full-sysroot
        (cd full-sysroot && gh release -R hbirchtree/coffeecutie-automation-tools download v2.2 -p desktop_x86_64-buildroot-linux-gnu_*_target.tar.xz && tar xf *.tar.xz && rm *.tar.xz)
        find "$PWD/full-sysroot/usr/lib" -maxdepth 1 -name "*.so*" -exec ln -sf {} "$PWD/sysroot/lib/" \;
        find "$PWD/full-sysroot/lib" -maxdepth 1 -name "*.so*" -exec ln -sf {} "$PWD/sysroot/lib/" \;
    - name: Locating server binary and assets
      id: server
      run: |
        BINARY=$(find server_artifacts -name BlamGraphics -type f | head -n 1)
        ASSETS_DIR=$(find server_artifacts -name assets -type d | head -n 1)
        DRI_PATH=$(find "$PWD/full-sysroot" -name dri -type d | head -n 1)
        SYS_LD=$(find "$PWD/full-sysroot" -name "ld-linux-x86-64.so.2" | head -n 1)
        chmod +x "$BINARY"
        echo "binary=$PWD/$BINARY" >> "$GITHUB_OUTPUT"
        echo "assets=$PWD/$ASSETS_DIR" >> "$GITHUB_OUTPUT"
        echo "dri_path=$DRI_PATH" >> "$GITHUB_OUTPUT"
        echo "ld=$SYS_LD" >> "$GITHUB_OUTPUT"
    - name: Locating wasm client bundle
      id: bundle
      run: |
        BUNDLE=$(find client_artifacts -type d -name BlamGraphics.bundle | head -n 1)
        echo "dir=$PWD/$BUNDLE" >> "$GITHUB_OUTPUT"
    - name: Downloading test assets
      run: |
        mkdir -p maps/pc/
        wget -q -O maps/pc/bloodgulch.map --header="Authorization: $MAP_ACCESS_TOKEN" https://maps.speen.dev/pc/bloodgulch.map
        wget -q -O maps/pc/bitmaps.map    --header="Authorization: $MAP_ACCESS_TOKEN" https://maps.speen.dev/pc/bitmaps.map
        wget -q -O maps/pc/sounds.map     --header="Authorization: $MAP_ACCESS_TOKEN" https://maps.speen.dev/pc/sounds.map
    - name: Installing gateway binary
      run: |
        mkdir -p source/tools/webrtc-gateway
        cp gateway_artifacts/gateway source/tools/webrtc-gateway/gateway
        chmod +x source/tools/webrtc-gateway/gateway
    - name: Run WebRTC wasm-client test
      env:
        LIBGL_ALWAYS_SOFTWARE: "1"
        GALLIUM_DRIVER: llvmpipe
        LIBGL_DRIVERS_PATH: ${{ steps.server.outputs.dri_path }}
        MESA_LOADER_DRIVER_PATH: ${{ steps.server.outputs.dri_path }}
        LIBGL_DRI3_DISABLE: "1"
        EGL_PLATFORM: surfaceless
        SERVER_BINARY: ${{ steps.server.outputs.binary }}
        SERVER_LD: ${{ steps.server.outputs.ld }}
        SERVER_LIB_PATH: ${{ github.workspace }}/sysroot/lib
        RESOURCE_DIR: ${{ steps.server.outputs.assets }}/
        MAP: ${{ github.workspace }}/maps/pc/bloodgulch.map
        CI: "true"
        # More headroom than the script's own local-dev defaults: a shared
        # CI runner's cold SwiftShader + headless Chromium boot can run
        # slower than a dev machine.
        RUN_TIMEOUT: "150"
        BOOT_TIMEOUT_MS: "60000"
        CONNECT_TIMEOUT_MS: "90000"
      run: |
        source/.github/tests/web/run_webrtc_web_client_test.sh "${{ steps.bundle.outputs.dir }}" /tmp/webrtc_wasm_client_test
    - name: Uploading test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_test_webrtc_wasm_client
        path: /tmp/webrtc_wasm_client_test
        if-no-files-found: error
  Test_webrtc_wasm_pair:
    # Wasm on BOTH sides: one browser page hosts (registering with
    # transport=webrtc), the other connects, and the gateway bridges their
    # two DataChannels -- no UDP in the path at all. Test_webrtc_wasm_client
    # covers the DataChannel<->UDP relay; this covers the
    # DataChannel<->DataChannel bridge (handleHostSignal) with a real
    # browser at each end, which nothing else does. Same script, same
    # markers, SERVER_ROLE=wasm -- so there is no native server, no
    # sysroot and no Mesa/EGL setup to do here.
    if: ${{ always() }}
    name: "WebRTC: Wasm <-> GW <-> Wasm"
    needs:
    - WebAssembly
    - WebRTCGateway
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Downloading web-wasm32-emscripten-webgl2 artifacts (both roles)
      uses: actions/download-artifact@v8
      with:
        name: web-wasm32-emscripten-webgl2
        path: client_artifacts/
    - name: Downloading webrtc-gateway-linux-amd64 artifact
      uses: actions/download-artifact@v8
      with:
        name: webrtc-gateway-linux-amd64
        path: gateway_artifacts/
    - name: Locating wasm bundle
      id: bundle
      run: |
        BUNDLE=$(find client_artifacts -type d -name BlamGraphics.bundle | head -n 1)
        echo "dir=$PWD/$BUNDLE" >> "$GITHUB_OUTPUT"
    - name: Downloading test assets
      run: |
        mkdir -p maps/pc/
        wget -q -O maps/pc/bloodgulch.map --header="Authorization: $MAP_ACCESS_TOKEN" https://maps.speen.dev/pc/bloodgulch.map
        wget -q -O maps/pc/bitmaps.map    --header="Authorization: $MAP_ACCESS_TOKEN" https://maps.speen.dev/pc/bitmaps.map
        wget -q -O maps/pc/sounds.map     --header="Authorization: $MAP_ACCESS_TOKEN" https://maps.speen.dev/pc/sounds.map
    - name: Installing gateway binary
      run: |
        mkdir -p source/tools/webrtc-gateway
        cp gateway_artifacts/gateway source/tools/webrtc-gateway/gateway
        chmod +x source/tools/webrtc-gateway/gateway
    - name: Run WebRTC wasm-to-wasm test
      env:
        SERVER_ROLE: wasm
        MAP: ${{ github.workspace }}/maps/pc/bloodgulch.map
        CI: "true"
        # Two software-rendered wasm pages share one small runner, so both
        # pages tick slowly: measured 64s from the client's connect request
        # to the gateway's SDP answer alone, with frame-loop gaps up to 36s.
        BOOT_TIMEOUT_MS: "90000"
        CONNECT_TIMEOUT_MS: "240000"
        HOST_READY_TIMEOUT_MS: "180000"
        # The host's heartbeats ride its frame loop, so those same stalls
        # exceed the gateway's 30s default TTL -- the registration was being
        # swept while the client was still connecting, leaving nothing to
        # attach the host side of the bridge to.
        GATEWAY_EXTRA_ARGS: "-registration-ttl 180s"
      run: |
        source/.github/tests/web/run_webrtc_web_client_test.sh "${{ steps.bundle.outputs.dir }}" /tmp/webrtc_wasm_pair_test
    - name: Uploading test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_test_webrtc_wasm_pair
        path: /tmp/webrtc_wasm_pair_test
        if-no-files-found: error
  Test_webrtc_nat_punch:
    # Same wasm-client/native-server scenario as Test_webrtc_wasm_client,
    # but against a real gateway deployed on the internet (the
    # WEBRTC_GATEWAY_SERVER secret) instead of one on loopback: the runner
    # sits behind NAT with no port forwarding, so registration and relay
    # can only work if the server's own UDP punches opened the mappings.
    # Skipped when the secret isn't available (forks, PRs from forks).
    # Replaces an earlier docker MASQUERADE topology that never passed.
    if: ${{ always() }}
    name: "WebRTC: Wasm <-> FW <-> GW <-> x86_64"
    needs:
    - Linux
    - WebAssembly
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
      GATEWAY_URL: ${{ secrets.WEBRTC_GATEWAY_SERVER }}
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Downloading desktop-x86_64-buildroot-linux-gnu-multi artifacts (server)
      uses: actions/download-artifact@v8
      with:
        name: desktop-x86_64-buildroot-linux-gnu-multi
        path: server_artifacts/
    - name: Downloading web-wasm32-emscripten-webgl2 artifacts (client)
      uses: actions/download-artifact@v8
      with:
        name: web-wasm32-emscripten-webgl2
        path: client_artifacts/
    - name: Installing Mesa/EGL dependencies
      run: |
        sudo apt update
        sudo apt install mesa-utils
    - name: Acquire the sysroot for the desktop x86_64 platform
      run: |
        # Same sysroot tarball the other server-running test jobs use --
        # the server binary and its whole Mesa/EGL stack come from it.
        mkdir -p sysroot/lib full-sysroot
        (cd full-sysroot && gh release -R hbirchtree/coffeecutie-automation-tools download v2.2 -p desktop_x86_64-buildroot-linux-gnu_*_target.tar.xz && tar xf *.tar.xz && rm *.tar.xz)
        find "$PWD/full-sysroot/usr/lib" -maxdepth 1 -name "*.so*" -exec ln -sf {} "$PWD/sysroot/lib/" \;
        find "$PWD/full-sysroot/lib" -maxdepth 1 -name "*.so*" -exec ln -sf {} "$PWD/sysroot/lib/" \;
    - name: Locating server binary and assets
      id: server
      run: |
        BINARY=$(find server_artifacts -name BlamGraphics -type f | head -n 1)
        ASSETS_DIR=$(find server_artifacts -name assets -type d | head -n 1)
        DRI_PATH=$(find "$PWD/full-sysroot" -name dri -type d | head -n 1)
        SYS_LD=$(find "$PWD/full-sysroot" -name "ld-linux-x86-64.so.2" | head -n 1)
        chmod +x "$BINARY"
        echo "binary=$PWD/$BINARY" >> "$GITHUB_OUTPUT"
        echo "assets=$PWD/$ASSETS_DIR" >> "$GITHUB_OUTPUT"
        echo "dri_path=$DRI_PATH" >> "$GITHUB_OUTPUT"
        echo "ld=$SYS_LD" >> "$GITHUB_OUTPUT"
    - name: Locating wasm client bundle
      id: bundle
      run: |
        BUNDLE=$(find client_artifacts -type d -name BlamGraphics.bundle | head -n 1)
        echo "dir=$PWD/$BUNDLE" >> "$GITHUB_OUTPUT"
    - name: Downloading test assets
      run: |
        mkdir -p maps/pc/
        wget -q -O maps/pc/bloodgulch.map --header="Authorization: $MAP_ACCESS_TOKEN" https://maps.speen.dev/pc/bloodgulch.map
        wget -q -O maps/pc/bitmaps.map    --header="Authorization: $MAP_ACCESS_TOKEN" https://maps.speen.dev/pc/bitmaps.map
        wget -q -O maps/pc/sounds.map     --header="Authorization: $MAP_ACCESS_TOKEN" https://maps.speen.dev/pc/sounds.map
    - name: Run WebRTC NAT punch-through test
      # No secret (fork PRs) means no gateway to test against -- skip
      # rather than fail; the loopback path is still covered by
      # Test_webrtc_wasm_client.
      if: ${{ env.GATEWAY_URL != '' }}
      env:
        LIBGL_ALWAYS_SOFTWARE: "1"
        GALLIUM_DRIVER: llvmpipe
        LIBGL_DRIVERS_PATH: ${{ steps.server.outputs.dri_path }}
        MESA_LOADER_DRIVER_PATH: ${{ steps.server.outputs.dri_path }}
        LIBGL_DRI3_DISABLE: "1"
        EGL_PLATFORM: surfaceless
        SERVER_BINARY: ${{ steps.server.outputs.binary }}
        SERVER_LD: ${{ steps.server.outputs.ld }}
        SERVER_LIB_PATH: ${{ github.workspace }}/sysroot/lib
        RESOURCE_DIR: ${{ steps.server.outputs.assets }}/
        MAP: ${{ github.workspace }}/maps/pc/bloodgulch.map
        CI: "true"
        RUN_TIMEOUT: "150"
        BOOT_TIMEOUT: "90"
        BOOT_TIMEOUT_MS: "60000"
        CONNECT_TIMEOUT_MS: "90000"
      run: |
        source/.github/tests/net/run_webrtc_nat_punch_test.sh "${{ steps.bundle.outputs.dir }}" /tmp/webrtc_nat_punch_test
    - name: Uploading test artifacts
      if: ${{ always() && env.GATEWAY_URL != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_test_webrtc_nat_punch
        path: /tmp/webrtc_nat_punch_test
        if-no-files-found: error
  Test_gekko:
    if: ${{ always() }}
    name: "Software render test (Dolphin, SW render)"
    needs: Gekko
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - name: Installing Dolphin dependencies
      run: |
        sudo apt update
        sudo apt install build-essential ffmpeg xvfb mesa-utils libavcodec-dev libavformat-dev libavutil-dev libevdev-dev libegl1-mesa-dev libgl1-mesa-dev libncurses5-dev libswresample-dev libswscale-dev libtool libtool-bin libudev-dev cmake pkg-config
    - name: Downloading console-powerpc-eabi-cube artifacts
      uses: actions/download-artifact@v8
      with:
        name: console-powerpc-eabi-cube
        path: artifacts/
    - name: Dolphin cache
      uses: actions/cache@v5
      with:
        path: source/multi_build/runtime/dolphin/bin
        key: dolphin-${{ runner.os }}-${{ hashFiles('source/.github/tests/dolphin/build.sh') }}
    - name: Run Dolphin software-render smoke test
      env:
        CI: "true"
        DOLPHIN_RENDERER: "Software Renderer"
        DUMP_FILE: "/tmp/dolphin_run/dump.mp4"
      run: |
        find artifacts/ -type f
        mkdir /tmp/dolphin_run
        source/.github/tests/dolphin/build.sh
        source/.github/tests/dolphin/dolphin.sh artifacts/BlamBSP_GX.elf 2>&1 | tee /tmp/dolphin_run/output.log
    - name: Uploading test artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_test_gekko
        path: /tmp/dolphin_run
        if-no-files-found: error
  Test_x86_64_mesa_gather:
    if: ${{ always() }}
    name: "Gather test results"
    needs:
    - Test_x86_64_mesa
    - Test_wasm_swiftshader
    - Test_webrtc_wasm_client
    - Test_webrtc_wasm_pair
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - name: Downloading test artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: dummy_plug_test_*
        path: artifacts/
    - name: Gathering test results into HTML page
      run: |
        ls -R artifacts/
        source/.github/tests/generate_test_page.sh artifacts/
    - name: Upload generated page
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_results
        path: "artifacts/generated/"
        if-no-files-found: error
  Deploy:
    if: ${{ always() && needs.Test_wasm_swiftshader.result == 'success' }}
    needs:
    - Linux
    - macOS
    - Test_wasm_swiftshader
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
    - name: Gathering artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts/
    - name: Generating GitHub Pages archive
      run: |
        mkdir -p _site/downloads/ _site/custom/ _site/mcc/ _site/trial/
        curl -L -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts -o _site/artifacts.json
        cp artifacts/web-wasm32-emscripten-webgl2/BlamGraphics.bundle/favicon.ico _site/
        cp -r artifacts/web-wasm32-emscripten-webgl2 _site/bin
        cp -r artifacts/web-wasm32-emscripten-webgl2-custom _site/custom/bin
        cp -r artifacts/web-wasm32-emscripten-webgl2-mcc _site/mcc/bin
        cp -r artifacts/web-wasm32-emscripten-webgl2-trial _site/trial/bin
        cp -r artifacts/web-wasm32-emscripten-webgl2-xbox _site/xbox/bin
        for f in $(find artifacts/ -mindepth 1 -maxdepth 1); do pushd $f; [[ -f apps.tar ]] && (tar xvf apps.tar && rm apps.tar); tar Jcvf ../../_site/downloads/$(basename $f).tar.xz .; popd; done
    - name: Uploading GitHub Pages examples
      uses: actions/upload-pages-artifact@v4
    - name: Deploy examples to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
