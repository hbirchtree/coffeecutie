name: CMake Build
'on':
  push:
    branches:
    - master
    - testing
    - feature**
    tags: '*'
jobs:
  Release:
    name: "Create release"
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Printing some info
      run: echo "Received ref $GITHUB_REF"
    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      run: gh release create ${GITHUB_REF:10} -R ${{ github.repository }} -p -t "Automatic
        Release ${GITHUB_REF:10}" -n "Automatically generated by Actions" --target
        ${{ github.sha }}
  Linux_HostTools:
    runs-on: ubuntu-latest
    needs: Release
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    name: Linux host tools
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - name: Installing build-essential
      run: |
        sudo rm /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt install build-essential nasm autoconf automake autoconf-archive libtool
    - uses: ./source/.github/actions/build-host-tools
      with:
        cache_path: source/multi_build/host-x64-linux-native
  Linux:
    runs-on: ubuntu-latest
    needs: Linux_HostTools
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: android:arm-neon:19:rel
          artifact: android-arm-neon-19
          args: ''
        - variant: android:arm-neon:24:rel
          artifact: android-arm-neon-24
          args: ''
        - variant: android:arm64:30-gl:rel
          artifact: android-arm64-30-gl
          args: -DBUILD_BLAM_DIMETER=ON -DBUILD_BLAM_ELEGY=ON
        - variant: android:arm64:32:rel
          artifact: android-arm64-32
          args: -DBUILD_BLAM_DIMETER=ON -DBUILD_BLAM_ELEGY=ON
        - variant: beaglebone:arm-buildroot-linux-gnueabihf:ti-sgx:rel
          artifact: beaglebone-arm-buildroot-linux-gnueabihf-ti-sgx
          args: ''
        - variant: desktop:aarch64-buildroot-linux-gnu:multi:rel
          artifact: desktop-aarch64-buildroot-linux-gnu-multi
          args: -DBUILD_BLAM_DIMETER=ON -DBUILD_BLAM_ELEGY=ON
        - variant: desktop:arm-buildroot-linux-gnueabihf:sdl2:rel
          artifact: desktop-arm-buildroot-linux-gnueabihf-sdl2
          args: ''
        - variant: desktop:x86_64-buildroot-linux-gnu:multi:rel
          artifact: desktop-x86_64-buildroot-linux-gnu-multi
          args: -DBUILD_BLAM_DIMETER=ON -DBUILD_BLAM_ELEGY=ON
        - variant: desktop:x86_64-w64-mingw32:posix:rel
          artifact: desktop-x86_64-w64-mingw32-posix
          args: -DBUILD_BLAM_DIMETER=ON -DBUILD_BLAM_ELEGY=ON
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    name: ${{ matrix.variant }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - uses: actions/setup-java@v5
      if: startsWith(matrix.variant, 'android:')
      with:
        distribution: 'adopt'
        java-version: '17'
    - name: Installing build-essential
      run: |
        sudo rm /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt install build-essential inkscape flatpak nasm squashfs-tools autoconf automake autoconf-archive libtool
    - name: Host tools cache
      uses: actions/cache@v5
      with:
        path: source/multi_build/host-x64-linux-native
        key: host-tools-${{ runner.os }}-${{ hashFiles('source/toolchain/building.py','source/.cmake/CMakePresets.linux.json','source/.cmake/CMakePresets.apple.json') }}
        fail-on-cache-miss: true
    - name: Space summary
      run: |
        echo "::info::Total disk usage"
        df -h
        echo "::info::Source dir space usage"
        df -h source/
        echo "::info::du in source/"
        du -hd2 source/
        echo "::info::du in ."
        du -hd2 .
    - uses: ./source/.github/actions/build-project
      with:
        variant: ${{ matrix.variant }}
        artifact: ${{ matrix.artifact }}
        args: ${{ matrix.args }}
        embedded_report_url: "https://reports.speen.dev"
    - name: Summarize binary sizes
      run: du -h source/multi_build/${{matrix.artifact}}/bin/* source/multi_build/${{matrix.artifact}}/lib/*.so* source/multi_build/${{matrix.artifact}}/packaged/*/* || true
    - name: Uploading artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.artifact}}
        path: |
          source/multi_build/${{matrix.artifact}}/install/bin
          source/multi_build/${{matrix.artifact}}/install/lib
          !source/multi_build/${{matrix.artifact}}/install/lib/*.a
          source/multi_build/${{matrix.artifact}}/install/packaged
        if-no-files-found: error
  Linux_GLES:
    runs-on: ubuntu-latest
    needs: Linux_HostTools
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
      BUILD_DIR: desktop-x86_64-buildroot-linux-gnu-multi
      ARTIFACT: desktop-x86_64-buildroot-linux-gnu-multi-gles
    name: "desktop:x86_64-buildroot-linux-gnu:multi:rel (GLES 3.2)"
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - name: Installing build-essential
      run: |
        sudo rm /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt install build-essential inkscape flatpak nasm squashfs-tools autoconf automake autoconf-archive libtool
    - name: Host tools cache
      uses: actions/cache@v5
      with:
        path: source/multi_build/host-x64-linux-native
        key: host-tools-${{ runner.os }}-${{ hashFiles('source/toolchain/building.py','source/.cmake/CMakePresets.linux.json','source/.cmake/CMakePresets.apple.json') }}
        fail-on-cache-miss: true
    - uses: ./source/.github/actions/build-project
      with:
        variant: desktop:x86_64-buildroot-linux-gnu:multi:rel
        artifact: ${{ env.ARTIFACT }}
        args: -DBUILD_GLES=ON -DBUILD_GLES_31=ON -DBUILD_GLES_32=ON -DBUILD_BLAM_DIMETER=ON -DBUILD_BLAM_ELEGY=ON
    - name: Uploading artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT }}
        path: |
          source/multi_build/${{ env.BUILD_DIR }}/install/bin
          source/multi_build/${{ env.BUILD_DIR }}/install/lib
          !source/multi_build/${{ env.BUILD_DIR }}/install/lib/*.a
          source/multi_build/${{ env.BUILD_DIR }}/install/packaged
        if-no-files-found: error
  WebAssembly:
    runs-on: ubuntu-latest
    needs: Linux_HostTools
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: web:wasm32-emscripten:webgl2:rel
          build: web-wasm32-emscripten-webgl2
          args: -DBLAM_HALO_VERSION=xbox_version_t -DBUILD_BLAM_DIMETER=ON -DBUILD_BLAM_ELEGY=ON
          artifact: web-wasm32-emscripten-webgl2-xbox
        - variant: web:wasm32-emscripten:webgl2:rel
          build: web-wasm32-emscripten-webgl2
          args: -DBLAM_HALO_VERSION=pc_version_t
          artifact: web-wasm32-emscripten-webgl2
        - variant: web:wasm32-emscripten:webgl2:rel
          build: web-wasm32-emscripten-webgl2
          args: -DBLAM_HALO_VERSION=custom_version_t
          artifact: web-wasm32-emscripten-webgl2-custom
        - variant: web:wasm32-emscripten:webgl2:rel
          build: web-wasm32-emscripten-webgl2
          args: -DBLAM_HALO_VERSION=mcc_version_t
          artifact: web-wasm32-emscripten-webgl2-mcc
        - variant: web:wasm32-emscripten:webgl2:rel
          build: web-wasm32-emscripten-webgl2
          args: -DBLAM_HALO_VERSION=trial_version_t
          artifact: web-wasm32-emscripten-webgl2-trial
        - variant: web:wasm64-emscripten:webgl2:rel
          build: web-wasm64-emscripten-webgl2
          args: ''
          artifact: web-wasm64-emscripten-webgl2
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    name: ${{ matrix.artifact }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - name: Installing build-essential
      run: |
        sudo rm /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt install build-essential inkscape nasm autoconf automake autoconf-archive libtool
    - name: Host tools cache
      uses: actions/cache@v5
      with:
        path: source/multi_build/host-x64-linux-native
        key: host-tools-${{ runner.os }}-${{ hashFiles('source/toolchain/building.py','source/.cmake/CMakePresets.linux.json','source/.cmake/CMakePresets.apple.json') }}
        fail-on-cache-miss: true
    - uses: ./source/.github/actions/build-project
      with:
        variant: ${{ matrix.variant }}
        artifact: ${{ matrix.artifact }}
        args: ${{ matrix.args }}
        embedded_report_url: "https://reports.speen.dev"
    - name: Uploading artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.artifact}}
        path: source/multi_build/${{matrix.build}}/install/bin
        if-no-files-found: error
  Gekko:
    runs-on: ubuntu-latest
    needs: Linux_HostTools
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: console:powerpc-eabi:cube:rel
          artifact: console-powerpc-eabi-cube
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    name: ${{ matrix.variant }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - name: Installing build-essential
      run: |
        sudo rm /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt install build-essential inkscape nasm libgl1-mesa-dev autoconf automake autoconf-archive libtool
    - name: Host tools cache
      uses: actions/cache@v5
      with:
        path: source/multi_build/host-x64-linux-native
        key: host-tools-${{ runner.os }}-${{ hashFiles('source/toolchain/building.py','source/.cmake/CMakePresets.linux.json','source/.cmake/CMakePresets.apple.json') }}
        fail-on-cache-miss: true
    - uses: ./source/.github/actions/build-project
      with:
        variant: ${{ matrix.variant }}
        artifact: ${{ matrix.artifact }}
        target: BlamGX
    - name: Adding disc files to artifacts
      run: cp source/multi_build/${{matrix.artifact}}/examples/blam/gx-bsp/BlamGX_assets/loading.tpl source/multi_build/${{matrix.artifact}}/bin/
    - name: Uploading artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.artifact}}
        path: source/multi_build/${{matrix.artifact}}/bin
        if-no-files-found: error
  WebRTCGateway:
    # Standalone Go build, independent of the cb/vcpkg toolchain entirely --
    # tools/webrtc-gateway (see examples/blam/cblam-testing/WEBRTC_TRANSPORT.md)
    # is a separate process, not linked into BlamGraphics. Built once here,
    # cached and uploaded as an artifact, so Test_webrtc_wasm_client doesn't
    # pay for a Go module download + compile on every run.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - goarch: amd64
          artifact: webrtc-gateway-linux-amd64
        - goarch: arm64
          artifact: webrtc-gateway-linux-arm64
    name: "webrtc-gateway (linux/${{ matrix.goarch }})"
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - uses: actions/setup-go@v7
      with:
        go-version-file: source/tools/webrtc-gateway/go.mod
        cache-dependency-path: source/tools/webrtc-gateway/go.sum
    - name: Build gateway
      working-directory: source/tools/webrtc-gateway
      env:
        CGO_ENABLED: '0'
        GOOS: linux
        GOARCH: ${{ matrix.goarch }}
      run: go build -o gateway .
    - name: Uploading artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: source/tools/webrtc-gateway/gateway
        if-no-files-found: error
  macOS_HostTools:
    runs-on: macos-latest
    needs: Release
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    name: macOS host tools
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - name: List sysctl
      run: sysctl -a
    - name: Installing Inkscape + other stuff
      run: |
        brew install --cask inkscape
        brew install automake libtool autoconf autoconf-archive
    - uses: ./source/.github/actions/build-host-tools
      with:
        cache_path: source/multi_build/host-arm64-osx
        build_args: dbg
    - name: List files
      run: |
        du -hd4 source/multi_build/host-arm64-osx/
        find source/multi_build/host-arm64-osx/vcpkg_installed/arm64-osx/tools -type f
  macOS:
    runs-on: macos-latest
    needs: macOS_HostTools
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: desktop:x86_64-darwin:macos:rel
          artifact: desktop-x86_64-darwin-macos
          mode: rel
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    name: ${{ matrix.variant }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - name: Installing Inkscape + other stuff
      run: |
        brew install --cask inkscape
        brew install automake autoconf autoconf-archive libtool
        # git cmake ninja pkg-config wget
    - name: Host tools cache
      uses: actions/cache@v5
      with:
        path: source/multi_build/host-arm64-osx
        key: host-tools-${{ runner.os }}-${{ hashFiles('source/toolchain/building.py','source/.cmake/CMakePresets.linux.json','source/.cmake/CMakePresets.apple.json') }}
        fail-on-cache-miss: true
    - uses: ./source/.github/actions/build-project
      with:
        variant: ${{ matrix.variant }}
        artifact: ${{ matrix.artifact }}
    - name: Creating archive of artifacts
      run: tar cvf apps.tar source/multi_build/${{matrix.artifact}}/install/bin
    - name: Uploading artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.artifact}}
        path: apps.tar
        if-no-files-found: error
  iOS_Simulator:
    # Smoke test only: builds BlamGraphics for the arm64 simulator and checks
    # that it renders frames. Without a map token it runs without a map.
    runs-on: macos-latest
    needs: macOS_HostTools
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    name: ios:arm64-darwin:simulator smoke test
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - name: Installing Inkscape + other stuff
      run: |
        brew install --cask inkscape
        brew install automake autoconf autoconf-archive libtool
    - name: Host tools cache
      uses: actions/cache@v5
      with:
        path: source/multi_build/host-arm64-osx
        key: host-tools-${{ runner.os }}-${{ hashFiles('source/toolchain/building.py','source/.cmake/CMakePresets.linux.json','source/.cmake/CMakePresets.apple.json') }}
        fail-on-cache-miss: true
    # Xbox maps are self-contained, so the smoke test only needs one download
    - uses: ./source/.github/actions/build-project
      with:
        variant: ios:arm64-darwin:simulator:rel
        artifact: ios-arm64-darwin-simulator
        target: BlamGraphics
        args: -DBLAM_HALO_VERSION=xbox_version_t
    - name: Downloading test map
      if: env.MAP_ACCESS_TOKEN != ''
      run: |
        mkdir -p maps/xbox_ex
        curl -fsS -o maps/xbox_ex/beavercreek.map -H "Authorization: $MAP_ACCESS_TOKEN" https://maps.speen.dev/xbox_ex/beavercreek.map
    - name: Run simulator smoke test
      env:
        # Runner VMs have no GPU, so loading and rendering crawl
        RUN_TIMEOUT: "600"
      run: |
        APP=$(find source/multi_build/ios-arm64-darwin-simulator/bin -maxdepth 2 -type d -name BlamGraphics.app | head -n 1)
        MAP=""
        if [ -f maps/xbox_ex/beavercreek.map ]; then
          MAP="$PWD/maps/xbox_ex/beavercreek.map"
        fi
        source/.github/tests/ios/run_simulator_smoke.sh "$APP" /tmp/ios_simulator_smoke "$MAP"
    - name: Uploading test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ios_simulator_smoke_test
        path: /tmp/ios_simulator_smoke
        if-no-files-found: ignore
  Test_unit_x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: Linux_HostTools
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VARIANT: desktop:x86_64-buildroot-linux-gnu:multi:rel
    name: Unit tests (x86_64)
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        path: source
    - uses: ./source/.github/actions/cmake-setup
    - name: Installing build-essential
      run: |
        sudo rm /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt install build-essential nasm autoconf automake autoconf-archive libtool flatpak
    - name: Host tools cache
      uses: actions/cache@v5
      with:
        path: source/multi_build/host-x64-linux-native
        key: host-tools-${{ runner.os }}-${{ hashFiles('source/toolchain/building.py','source/.cmake/CMakePresets.linux.json','source/.cmake/CMakePresets.apple.json') }}
        fail-on-cache-miss: true
    - uses: ./source/.github/actions/build-project
      with:
        variant: ${{ env.VARIANT }}
        artifact: unit-tests-x86_64
        target: Tests
        args: -DBUILD_TESTS=ON
    - name: Running tests
      env:
        COFFEE_DISABLE_PROFILER: 1
      run: printf 'ctest --output-on-failure\n' | source/cb env ${VARIANT}
  Test_x86_64_mesa:
    if: ${{ always() }}
    name: "llvmpipe ${{ matrix.variant }}"
    needs: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: core_33
          dummy_plug: dummy_plug_core_33.json
        - variant: core_43
          dummy_plug: dummy_plug_core_43.json
        - variant: core_45
          dummy_plug: dummy_plug_core_45.json
        # The host plug makes the process a server and fork+execs a client
        # child; journals are compared afterwards. Boots bloodgulch,
        # switches to beavercreek mid-session.
        - variant: net_multiplayer
          dummy_plug: net/dummy_plug_net_host_scenario.json
          args: --map bloodgulch.map --journal-check net_multiplayer --no-audio
        # A second split screen seat on each side
        - variant: net_splitscreen
          dummy_plug: net/dummy_plug_net_host_splitscreen.json
          args: --map bloodgulch.map --journal-check net_splitscreen --no-audio
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - name: Installing xvfb/ffmpeg
      run: |
        sudo apt update
        sudo apt install ffmpeg xvfb
    - name: Downloading desktop-x86_64-buildroot-linux-gnu-multi artifacts
      uses: actions/download-artifact@v8
      with:
        name: desktop-x86_64-buildroot-linux-gnu-multi
        path: artifacts/
    - name: Sysroot cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/blamtest-cache/sysroot
        key: test-sysroot-v2.3
    - name: Run dummy plug test
      run: >
        xvfb-run --auto-servernum python3 source/.github/tests/run.py dummy-plug
        ${{ matrix.dummy_plug }} --artifacts artifacts --out /tmp/blam_test ${{ matrix.args }}
    - name: Uploading test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_test_${{ matrix.variant }}
        path: /tmp/blam_test
        if-no-files-found: error
  Test_x86_64_mesa_gles:
    name: "llvmpipe ${{ matrix.variant }}"
    needs: Linux_GLES
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: es_20
          dummy_plug: dummy_plug_es_20.json
        - variant: es_30
          dummy_plug: dummy_plug_es_30.json
        - variant: es_32
          dummy_plug: dummy_plug_es_32.json
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - name: Installing xvfb/ffmpeg
      run: |
        sudo apt update
        sudo apt install ffmpeg xvfb
    - name: Downloading desktop-x86_64-buildroot-linux-gnu-multi-gles artifacts
      uses: actions/download-artifact@v8
      with:
        name: desktop-x86_64-buildroot-linux-gnu-multi-gles
        path: artifacts/
    - name: Sysroot cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/blamtest-cache/sysroot
        key: test-sysroot-v2.3
    - name: Run dummy plug test
      run: >
        xvfb-run --auto-servernum python3 source/.github/tests/run.py dummy-plug
        ${{ matrix.dummy_plug }} --artifacts artifacts --out /tmp/blam_test
    - name: Uploading test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_test_${{ matrix.variant }}
        path: /tmp/blam_test
        if-no-files-found: error
  Test_wasm_swiftshader:
    if: ${{ always() }}
    name: "Software render test (SwiftShader, ${{ matrix.variant }}-emscripten, WebGL2)"
    needs: WebAssembly
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # wasm32 is the explicit PC build, wasm64 the default Xbox one
          - variant: wasm32
            map: pc/beavercreek.map
          - variant: wasm64
            map: xbox_ex/beavercreek.map
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Downloading web-${{ matrix.variant }}-emscripten-webgl2 artifacts
      uses: actions/download-artifact@v8
      with:
        name: web-${{ matrix.variant }}-emscripten-webgl2
        path: artifacts/
    - name: Run WebGL software-render smoke test
      run: >
        python3 source/.github/tests/run.py webgl artifacts --map ${{ matrix.map }}
        --run-seconds 30 --out /tmp/blam_webgl
    - name: Uploading test artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_test_${{ matrix.variant }}_webgl2
        path: /tmp/blam_webgl
        if-no-files-found: error
  Test_webrtc_wasm_client:
    # A wasm client, headless in Chromium, through one webrtc-gateway to a
    # fleet-registered native server: the production topology for the
    # DataChannel transport (examples/blam/cblam-testing/WEBRTC_TRANSPORT.md).
    # Verified by the client's console markers; wasm has no dummy plug.
    if: ${{ always() }}
    name: "Wasm <-> GW <-> x86_64"
    needs:
    - Linux
    - WebAssembly
    - WebRTCGateway
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Downloading desktop-x86_64-buildroot-linux-gnu-multi artifacts (server)
      uses: actions/download-artifact@v8
      with:
        name: desktop-x86_64-buildroot-linux-gnu-multi
        path: server_artifacts/
    - name: Downloading web-wasm32-emscripten-webgl2-xbox artifacts (client)
      uses: actions/download-artifact@v8
      with:
        name: web-wasm32-emscripten-webgl2-xbox
        path: client_artifacts/
    - name: Downloading webrtc-gateway-linux-amd64 artifact
      uses: actions/download-artifact@v8
      with:
        name: webrtc-gateway-linux-amd64
        path: gateway_artifacts/
    - name: Sysroot cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/blamtest-cache/sysroot
        key: test-sysroot-v2.3
    - name: Run WebRTC wasm-client test
      run: >
        python3 source/.github/tests/run.py web-client client_artifacts
        --artifacts server_artifacts --gateway-bin gateway_artifacts/gateway
        --out /tmp/webrtc_wasm_client_test
    - name: Uploading test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_test_webrtc_wasm_client
        path: /tmp/webrtc_wasm_client_test
        if-no-files-found: error
  Test_webrtc_wasm_pair:
    # Wasm on both sides: one page hosts (transport=webrtc), the other
    # connects, and the gateway bridges the two DataChannels. The only
    # coverage of handleHostSignal with a real browser at each end.
    if: ${{ always() }}
    name: "Wasm <-> GW <-> Wasm"
    needs:
    - WebAssembly
    - WebRTCGateway
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Downloading web-wasm32-emscripten-webgl2-xbox artifacts (both roles)
      uses: actions/download-artifact@v8
      with:
        name: web-wasm32-emscripten-webgl2-xbox
        path: client_artifacts/
    - name: Downloading webrtc-gateway-linux-amd64 artifact
      uses: actions/download-artifact@v8
      with:
        name: webrtc-gateway-linux-amd64
        path: gateway_artifacts/
    # Two software-rendered pages on one small runner tick slowly (64 s from
    # connect request to SDP answer measured), and the host's heartbeats
    # ride its frame loop, so the gateway's 30 s registration TTL is raised.
    - name: Run WebRTC wasm-to-wasm test
      run: >
        python3 source/.github/tests/run.py web-client client_artifacts
        --server-role wasm --gateway-bin gateway_artifacts/gateway
        --boot-timeout-ms 90000 --connect-timeout-ms 240000 --host-ready-timeout-ms 180000
        --gateway-args "-registration-ttl 180s"
        --out /tmp/webrtc_wasm_pair_test
    - name: Uploading test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_test_webrtc_wasm_pair
        path: /tmp/webrtc_wasm_pair_test
        if-no-files-found: error
  Test_webrtc_nat_punch:
    # As Test_webrtc_wasm_client, but against a gateway deployed on the
    # internet (WEBRTC_GATEWAY_SERVER secret): the runner sits behind NAT
    # with no port forwarding, so it only works if the server's own UDP
    # punches opened the mappings. Skipped without the secret (forks).
    if: ${{ always() }}
    name: "Wasm <-> FW <-> GW <-> x86_64"
    needs:
    - Linux
    - WebAssembly
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
      GATEWAY_URL: ${{ secrets.WEBRTC_GATEWAY_SERVER }}
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Downloading desktop-x86_64-buildroot-linux-gnu-multi artifacts (server)
      uses: actions/download-artifact@v8
      with:
        name: desktop-x86_64-buildroot-linux-gnu-multi
        path: server_artifacts/
    - name: Downloading web-wasm32-emscripten-webgl2-xbox artifacts (client)
      uses: actions/download-artifact@v8
      with:
        name: web-wasm32-emscripten-webgl2-xbox
        path: client_artifacts/
    - name: Sysroot cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/blamtest-cache/sysroot
        key: test-sysroot-v2.3
    - name: Run WebRTC NAT punch-through test
      if: ${{ env.GATEWAY_URL != '' }}
      run: >
        python3 source/.github/tests/run.py nat-punch client_artifacts
        --artifacts server_artifacts --boot-timeout 90
        --out /tmp/webrtc_nat_punch_test
    - name: Uploading test artifacts
      if: ${{ always() && env.GATEWAY_URL != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_test_webrtc_nat_punch
        path: /tmp/webrtc_nat_punch_test
        if-no-files-found: error
  Test_pinned_cert:
    # Native client and server over plain UDP, the server's certificate
    # signed by its own Ed25519 key and pinned by the client: the right key
    # connects authenticated, a wrong key is refused, no key still connects.
    if: ${{ always() }}
    name: x86_64 <-🔒-> x86_64
    needs: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - name: Downloading desktop-x86_64-buildroot-linux-gnu-multi artifacts
      uses: actions/download-artifact@v8
      with:
        name: desktop-x86_64-buildroot-linux-gnu-multi
        path: server_artifacts/
    - name: Sysroot cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/blamtest-cache/sysroot
        key: test-sysroot-v2.3
    - name: Run pinned certificate test
      run: >
        python3 source/.github/tests/run.py pinned-cert
        --artifacts server_artifacts --out /tmp/pinned_cert_test
    - name: Uploading test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pinned_cert_test
        path: /tmp/pinned_cert_test
        if-no-files-found: error
  Test_native_routes:
    if: ${{ always() }}
    name: "${{ matrix.title }}"
    needs: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - route: no-gateway
          title: 'x86_64 <-> x86_64'
        - route: direct
          title: 'x86_64 <-> x86_64 <--> GW'
        - route: relay
          title: 'x86_64 <-relay-> GW <-relay-> x86_64'
        - route: webrtc-hosted
          title: 'x86_64 <-> GW <-> Wasm'
        - route: relay-only-server
          title: 'x86_64 <-> GW <-relay-only-> x86_64'
        - route: relay-only-webrtc-server
          title: 'x86_64 <-> GW <-webrtc-> x86_64'
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - name: Downloading desktop-x86_64-buildroot-linux-gnu-multi artifacts
      uses: actions/download-artifact@v8
      with:
        name: desktop-x86_64-buildroot-linux-gnu-multi
        path: server_artifacts/
    - name: Downloading webrtc-gateway-linux-amd64 artifact
      uses: actions/download-artifact@v8
      with:
        name: webrtc-gateway-linux-amd64
        path: gateway_artifacts/
    - name: Sysroot cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/blamtest-cache/sysroot
        key: test-sysroot-v2.3
    - name: Run ${{ matrix.route }} route test
      run: >
        python3 source/.github/tests/run.py net --route ${{ matrix.route }}
        --artifacts server_artifacts --gateway-bin gateway_artifacts/gateway
        --out /tmp/native_route_test
    - name: Uploading test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: native_route_test_${{ matrix.route }}
        path: /tmp/native_route_test
        if-no-files-found: error
  Test_gekko:
    if: ${{ always() }}
    name: "Software render test (Dolphin, SW render)"
    needs: Gekko
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ACCESS_TOKEN: ${{ secrets.MAP_ACCESS_TOKEN }}
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - name: Installing Dolphin dependencies
      run: |
        sudo apt update
        sudo apt install build-essential ffmpeg xvfb mesa-utils libavcodec-dev libavformat-dev libavutil-dev libevdev-dev libegl1-mesa-dev libgl1-mesa-dev libncurses5-dev libswresample-dev libswscale-dev libtool libtool-bin libudev-dev cmake pkg-config
    - name: Downloading console-powerpc-eabi-cube artifacts
      uses: actions/download-artifact@v8
      with:
        name: console-powerpc-eabi-cube
        path: artifacts/
    - name: Dolphin cache
      uses: actions/cache@v5
      with:
        path: source/multi_build/runtime/dolphin/bin
        key: dolphin-${{ runner.os }}-${{ hashFiles('source/.github/tests/dolphin/build.sh') }}
    - name: Run Dolphin software-render smoke test
      env:
        CI: "true"
        DOLPHIN_RENDERER: "Software Renderer"
        DUMP_FILE: "/tmp/dolphin_run/dump.mp4"
      run: |
        find artifacts/ -type f
        mkdir /tmp/dolphin_run
        source/.github/tests/dolphin/build.sh
        source/.github/tests/dolphin/dolphin.sh artifacts/BlamGX.elf 2>&1 | tee /tmp/dolphin_run/output.log
    - name: Uploading test artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_test_gekko
        path: /tmp/dolphin_run
        if-no-files-found: error
  Test_x86_64_mesa_gather:
    if: ${{ always() }}
    name: "Gather test results"
    needs:
    - Test_x86_64_mesa
    - Test_x86_64_mesa_gles
    - Test_wasm_swiftshader
    - Test_webrtc_wasm_client
    - Test_webrtc_wasm_pair
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - name: Downloading test artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: dummy_plug_test_*
        path: artifacts/
    - name: Gathering test results into HTML page
      run: |
        ls -R artifacts/
        source/.github/tests/generate_test_page.sh artifacts/
    - name: Upload generated page
      uses: actions/upload-artifact@v7
      with:
        name: dummy_plug_results
        path: "artifacts/generated/"
        if-no-files-found: error
  Deploy:
    if: ${{ always() && needs.Test_wasm_swiftshader.result == 'success' }}
    needs:
    - Linux
    - macOS
    - Gekko
    - Test_wasm_swiftshader
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
    - name: Gathering artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts/
    - name: Generating GitHub Pages archive
      run: |
        mkdir -p _site/downloads/ _site/custom/ _site/mcc/ _site/trial/ _site/xbox/
        curl -L -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts -o _site/artifacts.json
        cp artifacts/web-wasm32-emscripten-webgl2/BlamGraphics.bundle/favicon.ico _site/
        cp -r artifacts/web-wasm32-emscripten-webgl2 _site/bin
        cp -r artifacts/web-wasm32-emscripten-webgl2-custom _site/custom/bin
        cp -r artifacts/web-wasm32-emscripten-webgl2-mcc _site/mcc/bin
        cp -r artifacts/web-wasm32-emscripten-webgl2-trial _site/trial/bin
        cp -r artifacts/web-wasm32-emscripten-webgl2-xbox _site/xbox/bin
        if [ -f artifacts/console-powerpc-eabi-cube/BlamGX.elf.dol ] && [ -d _site/bin/BlamMapUpload.bundle ]; then
          mkdir -p _site/bin/BlamMapUpload.bundle/gamecube
          cp artifacts/console-powerpc-eabi-cube/{BlamGX.elf.dol,gc_apploader.elf.img,loading.tpl} _site/bin/BlamMapUpload.bundle/gamecube/
          echo "${GITHUB_SHA}" > _site/bin/BlamMapUpload.bundle/gamecube/VERSION
        fi
        for f in $(find artifacts/ -mindepth 1 -maxdepth 1); do pushd $f; [[ -f apps.tar ]] && (tar xvf apps.tar && rm apps.tar); tar Jcvf ../../_site/downloads/$(basename $f).tar.xz .; popd; done
    - name: Uploading GitHub Pages examples
      uses: actions/upload-pages-artifact@v4
    - name: Deploy examples to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
